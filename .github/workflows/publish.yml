name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare versions with npm
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.compare.outputs.packages }}
      any: ${{ steps.compare.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: compare
        run: node scripts/unpublished-packages.mjs @cudoment/cudoc >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: check
    if: needs.check.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:run
      # Dependencies are published before the packages that depend on them.
      - name: Publish each unpublished package
        run: |
          for dir in ${{ needs.check.outputs.packages }}; do
            echo "publishing $dir"
            npm publish --workspace "$dir" --provenance --access public
          done
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for dir in ${{ needs.check.outputs.packages }}; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            tag="$name@$version"
            gh release view "$tag" >/dev/null 2>&1 ||
              gh release create "$tag" --title "$tag" --generate-notes
          done
