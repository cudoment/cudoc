name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:run

  pack:
    name: Install from a packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A packed install is the only check that exports, type declarations and
      # runtime dependencies are actually complete.
      - run: node scripts/verify-pack.mjs

  examples:
    name: Example sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The examples link the packages from `dist`, so they have to be built.
      - run: npm run build

      # Installed separately: site generators in one workspace would make
      # the root install slow and force them onto shared hoisted versions.
      - run: npm ci
        working-directory: examples/next-mdx
      - run: npm ci
        working-directory: examples/docusaurus
      - run: npm ci
        working-directory: examples/nextra
      - run: npm ci
        working-directory: examples/vitepress
      - run: npm ci
        working-directory: examples/html

      - run: npm run build
        working-directory: examples/next-mdx
      # cudoc has to work under either Next.js bundler, and only a real build
      # says whether the string plugin specifiers resolve in both.
      - run: npm run build:webpack
        working-directory: examples/next-mdx
      - run: npm run build
        working-directory: examples/docusaurus
      - run: npm run build
        working-directory: examples/nextra
      - run: npm run build
        working-directory: examples/vitepress
      - run: npm run build
        working-directory: examples/html
      - name: Native host syntax must normalize with cudoc syntax
        run: node scripts/check-native-hosts.mjs
      - name: Portable Markdown must render across all five hosts
        run: node scripts/compare-portable-hosts.mjs
      - name: Host libraries must export HTML with each link policy
        run: node scripts/check-html-hosts.mjs
      - name: Changed sources must refresh untouched embedding pages
        run: node scripts/check-portable-rebuild.mjs

      - name: The three hosts must render the same document the same way
        run: node scripts/compare-hosts.mjs
      # A remark plugin only runs when MDX is really compiled, so a reused
      # compilation cache can leave a site a version behind while passing.
      - name: An edit must reach every page and every exported AST
        run: node scripts/check-rebuild.mjs
