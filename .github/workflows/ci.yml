name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request makes the older run moot. A run on
# main is never cancelled once it has started, but one still waiting in the
# group gives way to a newer push, so of several pushes in a row only the last
# is sure to get a result; that is the commit a release is dispatched from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # These jobs never print a PDF, so they skip cudoc-export's 187MB browser.
    env:
      CUDOC_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      # `typecheck` covers the test code too, which the packages' own projects
      # exclude. vitest strips types instead of checking them, so without this
      # step a test that contradicts a compiler contract would pass in silence.
      - run: npm run typecheck
      - run: npm run test:run

  pack:
    env:
      CUDOC_SKIP_BROWSER_DOWNLOAD: "1"
    name: Install from a packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A packed install is the only check that exports, type declarations and
      # runtime dependencies are actually complete.
      - run: node tests/scripts/packed-consumers.mjs

  guides:
    env:
      CUDOC_SKIP_BROWSER_DOWNLOAD: "1"
    name: Follow every host guide in a new project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # The examples build what the repository wires up; this builds what a
      # reader of each guide wires up, from the packed packages. The host
      # versions come from the example lockfiles, so nothing else installs.
      - run: node tests/scripts/guide-consumers.mjs

  examples:
    name: Example sites
    runs-on: ubuntu-latest
    # This job installs everything every tier needs, the browser included, so
    # a case that skips here means a prerequisite went missing: fail on it.
    env:
      CUDOC_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          # The examples install from their own lockfiles too.
          cache-dependency-path: |
            package-lock.json
            examples/*/package-lock.json
      # The browser cudoc-export prints PDFs with, cached across runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # The examples link the packages from `dist`, so they have to be built.
      - run: npm run build
      # The unit tier again, now with the browser: printing, the review-note
      # runtime and the theme button run only here.
      - run: npm run test:run

      # Installed separately: site generators in one workspace would make
      # the root install slow and force them onto shared hoisted versions.
      - run: npm ci
        working-directory: examples/next-mdx
      - run: npm ci
        working-directory: examples/docusaurus
      - run: npm ci
        working-directory: examples/nextra
      - run: npm ci
        working-directory: examples/vitepress
      - run: npm ci
        working-directory: examples/eleventy
      - run: npm ci
        working-directory: examples/export

      # Compiles the shared fixtures with each example's own compiler. It needs
      # the installs above but no site build, so it runs before them and fails
      # fast on a syntax or normalization regression.
      - run: npm run test:examples

      - run: npm run build
        working-directory: examples/next-mdx
      # cudoc has to work under either Next.js bundler, and only a real build
      # says whether the string plugin specifiers resolve in both.
      - run: npm run build:webpack
        working-directory: examples/next-mdx
      - run: npm run build
        working-directory: examples/docusaurus
      - run: npm run build
        working-directory: examples/nextra
      - run: npm run build
        working-directory: examples/vitepress
      - run: npm run build
        working-directory: examples/eleventy
      - run: npm run build
        working-directory: examples/export
      # Every assertion on a built site: the portable page on all six hosts,
      # the library export under each link policy, and the MDX showcase across
      # the three MDX hosts.
      - name: Built sites must carry the same document semantics
        run: npm run test:built

      # These rewrite a shared fixture and rebuild the examples, so they run
      # last and one at a time. See tests/scripts/README.md.
      - name: Changed sources must refresh untouched embedding pages
        run: node tests/scripts/rebuild-portable.mjs
      # A remark plugin only runs when MDX is really compiled, so a reused
      # compilation cache can leave a site a version behind while passing.
      - name: An edit must reach every page and every exported AST
        run: node tests/scripts/rebuild-mdx.mjs
