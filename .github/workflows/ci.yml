name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    # These jobs never print a PDF, so they skip cudoc-export's 187MB browser.
    env:
      CUDOC_SKIP_BROWSER_DOWNLOAD: "1"
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      # `typecheck` covers the test code too, which the packages' own projects
      # exclude. vitest strips types instead of checking them, so without this
      # step a test that contradicts a compiler contract would pass in silence.
      - run: npm run typecheck
      - run: npm run test:run

  pack:
    env:
      CUDOC_SKIP_BROWSER_DOWNLOAD: "1"
    name: Install from a packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # A packed install is the only check that exports, type declarations and
      # runtime dependencies are actually complete.
      - run: node tests/scripts/packed-consumers.mjs

  examples:
    name: Example sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The browser cudoc-export prints PDFs with, cached across runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # The examples link the packages from `dist`, so they have to be built.
      - run: npm run build

      # Installed separately: site generators in one workspace would make
      # the root install slow and force them onto shared hoisted versions.
      - run: npm ci
        working-directory: examples/next-mdx
      - run: npm ci
        working-directory: examples/docusaurus
      - run: npm ci
        working-directory: examples/nextra
      - run: npm ci
        working-directory: examples/vitepress
      - run: npm ci
        working-directory: examples/eleventy
      - run: npm ci
        working-directory: examples/export

      # Compiles the shared fixtures with each example's own compiler. It needs
      # the installs above but no site build, so it runs before them and fails
      # fast on a syntax or normalization regression.
      - run: npm run test:examples

      - run: npm run build
        working-directory: examples/next-mdx
      # cudoc has to work under either Next.js bundler, and only a real build
      # says whether the string plugin specifiers resolve in both.
      - run: npm run build:webpack
        working-directory: examples/next-mdx
      - run: npm run build
        working-directory: examples/docusaurus
      - run: npm run build
        working-directory: examples/nextra
      - run: npm run build
        working-directory: examples/vitepress
      - run: npm run build
        working-directory: examples/eleventy
      - run: npm run build
        working-directory: examples/export
      # Every assertion on a built site: the portable page on all six hosts,
      # the library export under each link policy, and the MDX showcase across
      # the three MDX hosts.
      - name: Built sites must carry the same document semantics
        run: npm run test:built

      # These rewrite a shared fixture and rebuild the examples, so they run
      # last and one at a time. See tests/scripts/README.md.
      - name: Changed sources must refresh untouched embedding pages
        run: node tests/scripts/rebuild-portable.mjs
      # A remark plugin only runs when MDX is really compiled, so a reused
      # compilation cache can leave a site a version behind while passing.
      - name: An edit must reach every page and every exported AST
        run: node tests/scripts/rebuild-mdx.mjs
